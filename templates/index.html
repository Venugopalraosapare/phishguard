<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PhishGuard — Email Threat Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0c10;
      --surface:   #111318;
      --surface2:  #181c24;
      --border:    #23283a;
      --accent:    #00e5ff;
      --danger:    #ff3b5c;
      --safe:      #00e676;
      --muted:     #4a5068;
      --text:      #c8d0e8;
      --text-dim:  #6b7494;
      --mono:      'Space Mono', monospace;
      --sans:      'DM Sans', sans-serif;
    }

    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1rem 4rem;
    }

    /* ── grid noise overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── header ── */
    header {
      width: 100%;
      max-width: 780px;
      padding: 3rem 0 2rem;
      position: relative;
      z-index: 1;
    }

    .logo-line {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: .5rem;
    }

    .logo-icon {
      width: 32px; height: 32px;
      border: 1.5px solid var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono);
      font-size: 14px;
      color: var(--accent);
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(0,229,255,.2);
    }

    h1 {
      font-family: var(--mono);
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      color: #fff;
      letter-spacing: -.5px;
    }

    h1 span { color: var(--accent); }

    .tagline {
      font-size: .875rem;
      color: var(--text-dim);
      font-family: var(--mono);
      letter-spacing: .5px;
    }

    /* ── main card ── */
    main {
      width: 100%;
      max-width: 780px;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .card-label {
      font-family: var(--mono);
      font-size: .7rem;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .card-label::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    /* ── textarea ── */
    .input-wrap { position: relative; }

    textarea {
      width: 100%;
      min-height: 200px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: .85rem;
      line-height: 1.7;
      padding: 1.25rem;
      resize: vertical;
      outline: none;
      transition: border-color .2s;
      caret-color: var(--accent);
    }

    textarea::placeholder { color: var(--muted); }

    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,229,255,.08); }

    .char-count {
      position: absolute;
      bottom: .75rem; right: 1rem;
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
      pointer-events: none;
    }

    /* ── sample buttons ── */
    .samples {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      align-items: center;
    }

    .samples-label {
      font-size: .75rem;
      color: var(--text-dim);
      font-family: var(--mono);
      margin-right: .25rem;
    }

    .sample-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-dim);
      font-family: var(--sans);
      font-size: .75rem;
      padding: .3rem .85rem;
      cursor: pointer;
      transition: all .15s;
    }

    .sample-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,229,255,.05);
    }

    .sample-btn.danger:hover {
      border-color: var(--danger);
      color: var(--danger);
      background: rgba(255,59,92,.05);
    }

    /* ── analyze button ── */
    .btn-analyze {
      width: 100%;
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--accent);
      color: #000;
      font-family: var(--mono);
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all .2s;
      position: relative;
      overflow: hidden;
    }

    .btn-analyze:hover { background: #33ecff; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(0,229,255,.25); }
    .btn-analyze:active { transform: translateY(0); }
    .btn-analyze:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .btn-analyze .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      margin: 0 auto;
    }

    .btn-analyze.loading .btn-text { display: none; }
    .btn-analyze.loading .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── result card ── */
    #result-card {
      display: none;
      animation: fadeUp .35s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .verdict-row {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
    }

    .verdict-badge {
      font-family: var(--mono);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 3px;
      padding: .6rem 1.5rem;
      border-radius: 8px;
    }

    .verdict-badge.phishing {
      color: var(--danger);
      background: rgba(255,59,92,.1);
      border: 1.5px solid var(--danger);
      box-shadow: 0 0 24px rgba(255,59,92,.15);
    }

    .verdict-badge.legitimate {
      color: var(--safe);
      background: rgba(0,230,118,.1);
      border: 1.5px solid var(--safe);
      box-shadow: 0 0 24px rgba(0,230,118,.15);
    }

    .verdict-desc {
      flex: 1;
      min-width: 180px;
    }

    .verdict-desc .confidence {
      font-size: 1.75rem;
      font-weight: 300;
      color: #fff;
      font-family: var(--mono);
      line-height: 1;
    }

    .verdict-desc .conf-label {
      font-size: .75rem;
      color: var(--text-dim);
      font-family: var(--mono);
      letter-spacing: 1px;
      margin-top: .25rem;
    }

    /* ── probability bars ── */
    .prob-section { margin-bottom: 1.75rem; }

    .prob-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: .75rem;
    }

    .prob-label {
      font-family: var(--mono);
      font-size: .75rem;
      width: 90px;
      flex-shrink: 0;
      color: var(--text-dim);
    }

    .prob-bar-track {
      flex: 1;
      height: 6px;
      background: var(--surface2);
      border-radius: 3px;
      overflow: hidden;
    }

    .prob-bar-fill {
      height: 100%;
      border-radius: 3px;
      width: 0%;
      transition: width .8s cubic-bezier(.4,0,.2,1);
    }

    .prob-bar-fill.phishing { background: var(--danger); box-shadow: 0 0 8px rgba(255,59,92,.4); }
    .prob-bar-fill.legitimate { background: var(--safe); box-shadow: 0 0 8px rgba(0,230,118,.4); }

    .prob-pct {
      font-family: var(--mono);
      font-size: .8rem;
      width: 42px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── top trigger words ── */
    .words-section {}

    .words-title {
      font-family: var(--mono);
      font-size: .7rem;
      letter-spacing: 2px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: .75rem;
    }

    .word-tags {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
    }

    .word-tag {
      font-family: var(--mono);
      font-size: .78rem;
      padding: .3rem .75rem;
      border-radius: 4px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      transition: all .2s;
    }

    .word-tag.phishing-tag { border-color: rgba(255,59,92,.3); color: var(--danger); background: rgba(255,59,92,.06); }
    .word-tag.legit-tag    { border-color: rgba(0,230,118,.3); color: var(--safe);   background: rgba(0,230,118,.06); }

    /* ── error message ── */
    .error-msg {
      display: none;
      background: rgba(255,59,92,.08);
      border: 1px solid rgba(255,59,92,.3);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      color: var(--danger);
      font-family: var(--mono);
      font-size: .85rem;
      margin-top: 1rem;
    }

    /* ── footer ── */
    footer {
      width: 100%;
      max-width: 780px;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .5rem;
      position: relative;
      z-index: 1;
    }

    footer p {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
      letter-spacing: .5px;
    }

    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <div class="logo-line">
    <div class="logo-icon">PG</div>
    <h1>Phish<span>Guard</span></h1>
  </div>
  <p class="tagline">// ML-powered email threat analyzer · Naive Bayes · TF-IDF</p>
</header>

<main>

  <!-- Input card -->
  <div class="card">
    <div class="card-label">Email Input</div>
    <div class="input-wrap">
      <textarea id="email-input" placeholder="Paste the full email text here to analyze for phishing threats..."></textarea>
      <span class="char-count" id="char-count">0 chars</span>
    </div>

    <div class="samples">
      <span class="samples-label">Try sample:</span>
      <button class="sample-btn danger" onclick="loadSample('phishing1')">Phishing #1</button>
      <button class="sample-btn danger" onclick="loadSample('phishing2')">Phishing #2</button>
      <button class="sample-btn" onclick="loadSample('legit1')">Legitimate #1</button>
      <button class="sample-btn" onclick="loadSample('legit2')">Legitimate #2</button>
    </div>

    <button class="btn-analyze" id="analyze-btn" onclick="analyzeEmail()">
      <span class="btn-text">Analyze Email</span>
      <div class="spinner"></div>
    </button>

    <div class="error-msg" id="error-msg"></div>
  </div>

  <!-- Result card -->
  <div class="card" id="result-card">
    <div class="card-label">Analysis Result</div>

    <div class="verdict-row">
      <div class="verdict-badge" id="verdict-badge">—</div>
      <div class="verdict-desc">
        <div class="confidence" id="confidence-val">—</div>
        <div class="conf-label">MODEL CONFIDENCE</div>
      </div>
    </div>

    <div class="prob-section">
      <div class="prob-row">
        <span class="prob-label">Phishing</span>
        <div class="prob-bar-track"><div class="prob-bar-fill phishing" id="bar-phishing"></div></div>
        <span class="prob-pct" id="pct-phishing" style="color:var(--danger)">—</span>
      </div>
      <div class="prob-row">
        <span class="prob-label">Legitimate</span>
        <div class="prob-bar-track"><div class="prob-bar-fill legitimate" id="bar-legit"></div></div>
        <span class="prob-pct" id="pct-legit" style="color:var(--safe)">—</span>
      </div>
    </div>

    <div class="words-section">
      <div class="words-title">Top trigger words detected</div>
      <div class="word-tags" id="word-tags"></div>
    </div>
  </div>

</main>

<footer>
  <p>Built with Python · scikit-learn · Flask · Trained on 18k emails</p>
  <p><a href="https://github.com" target="_blank">View on GitHub →</a></p>
</footer>

<script>
  const SAMPLES = {
    phishing1: `URGENT: Your account has been suspended due to suspicious activity.

Dear Valued Customer,

We have detected unauthorized access to your account. You must verify your identity immediately or your account will be permanently closed within 24 hours.

Click here to verify: http://secure-login-verify.net/account

You will need to confirm your full name, date of birth, and credit card details to restore access. Failure to act now will result in permanent suspension.

This is your final warning.

Security Team`,

    phishing2: `Congratulations! You have been selected as our lucky winner!

You have won a $1,000 Amazon Gift Card in our monthly customer survey.

To claim your prize before it expires in 2 hours:
1. Click the secure link below
2. Enter your shipping address
3. Pay a small $2.99 processing fee

CLAIM NOW: http://amazon-prize-claim.xyz/winner

This offer expires TONIGHT. Act fast or lose your prize forever!`,

    legit1: `Hi Sarah,

Just following up on the Q3 budget report we discussed in Tuesday's meeting. I've attached the revised figures with the department breakdowns you requested.

A few things to note:
- Marketing came in 8% under budget
- The IT infrastructure project is still pending approval from finance

Can we schedule 30 minutes this week to go through it together? I'm free Thursday afternoon or any time Friday.

Thanks,
James`,

    legit2: `Team,

Quick reminder that the all-hands meeting has been moved from 2pm to 3:30pm this Thursday due to a scheduling conflict with the executive team.

The agenda remains the same:
- Q4 roadmap review
- New hire introductions
- Open floor for questions

Please update your calendars. The Zoom link is unchanged.

See you all Thursday.
— Operations Team`
  };

  const textarea = document.getElementById('email-input');
  const charCount = document.getElementById('char-count');

  textarea.addEventListener('input', () => {
    charCount.textContent = textarea.value.length + ' chars';
  });

  function loadSample(key) {
    textarea.value = SAMPLES[key];
    charCount.textContent = textarea.value.length + ' chars';
    textarea.focus();
    // hide previous result
    document.getElementById('result-card').style.display = 'none';
    document.getElementById('error-msg').style.display = 'none';
  }

  async function analyzeEmail() {
    const text = textarea.value.trim();
    const btn  = document.getElementById('analyze-btn');
    const errEl = document.getElementById('error-msg');

    errEl.style.display = 'none';

    if (!text) {
      showError('Please paste some email text before analyzing.');
      return;
    }
    if (text.length < 10) {
      showError('Email text is too short to analyze.');
      return;
    }

    // Loading state
    btn.disabled = true;
    btn.classList.add('loading');

    try {
      const res = await fetch('/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email_text: text })
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'Something went wrong. Please try again.');
        return;
      }

      showResult(data);

    } catch (err) {
      showError('Could not reach the server. Make sure app.py is running.');
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  }

  function showResult(data) {
    const card       = document.getElementById('result-card');
    const badge      = document.getElementById('verdict-badge');
    const confVal    = document.getElementById('confidence-val');
    const barPhish   = document.getElementById('bar-phishing');
    const barLegit   = document.getElementById('bar-legit');
    const pctPhish   = document.getElementById('pct-phishing');
    const pctLegit   = document.getElementById('pct-legit');
    const wordTags   = document.getElementById('word-tags');

    // Verdict badge
    badge.textContent = data.verdict;
    badge.className   = 'verdict-badge ' + (data.is_phishing ? 'phishing' : 'legitimate');

    // Confidence
    confVal.textContent = data.confidence + '%';

    // Bars (animate via timeout so CSS transition fires)
    barPhish.style.width = '0%';
    barLegit.style.width = '0%';
    pctPhish.textContent = data.phishing_pct + '%';
    pctLegit.textContent = data.legit_pct + '%';

    setTimeout(() => {
      barPhish.style.width = data.phishing_pct + '%';
      barLegit.style.width = data.legit_pct + '%';
    }, 50);

    // Trigger words
    const tagClass = data.is_phishing ? 'phishing-tag' : 'legit-tag';
    wordTags.innerHTML = data.top_words.length
      ? data.top_words.map(w => `<span class="word-tag ${tagClass}">${w}</span>`).join('')
      : '<span style="color:var(--muted);font-size:.8rem;font-family:var(--mono)">No significant trigger words found</span>';

    // Show card
    card.style.display = 'block';
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function showError(msg) {
    const errEl = document.getElementById('error-msg');
    errEl.textContent = '⚠ ' + msg;
    errEl.style.display = 'block';
  }
</script>

</body>
</html>
